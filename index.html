<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ticket — Job & Invoice Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C1E22;
    --ink-soft:#2A2D33;
    --paper:#F7F5F0;
    --paper-dim:#EDEAE2;
    --yellow:#F5C826;
    --yellow-deep:#D9A800;
    --blue:#2C5F7C;
    --blue-soft:#4A7E9B;
    --green:#3E8914;
    --red:#C1440E;
    --line:rgba(28,30,34,0.12);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
    font-weight:700;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:32px 28px;background:var(--ink);color:var(--paper);
  }
  .login-screen .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .punch{width:14px;height:14px;border-radius:50%;background:var(--paper);opacity:0.15;}
  .login-screen h1{font-size:42px;line-height:0.95;color:var(--paper);}
  .login-screen .tag{color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.08em;margin-top:8px;margin-bottom:36px;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:rgba(247,245,240,0.6);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;text-transform:uppercase;}
  .field input, .field select, .field textarea{
    width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid rgba(247,245,240,0.18);
    background:rgba(247,245,240,0.06);color:var(--paper);font-size:15px;font-family:'Inter',sans-serif;
  }
  .field input::placeholder{color:rgba(247,245,240,0.35);}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:15px 20px;border-radius:10px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;width:100%;font-family:'Inter',sans-serif;transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--yellow);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid rgba(247,245,240,0.25);margin-top:10px;}
  .switch-role{margin-top:22px;text-align:center;font-size:13px;color:rgba(247,245,240,0.5);}
  .switch-role button{background:none;border:none;color:var(--yellow);font-weight:600;cursor:pointer;font-size:13px;}

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky;top:0;z-index:10;background:var(--ink);color:var(--paper);
    padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--yellow);
  }
  .topbar .co-name{font-size:22px;}
  .topbar .role-pill{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(245,200,38,0.15);color:var(--yellow);padding:4px 9px;border-radius:20px;margin-top:2px;display:inline-block;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:rgba(247,245,240,0.1);border:none;
    color:var(--paper);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  /* ---------- CONTENT ---------- */
  .content{padding:18px 18px 8px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px;}
  .section-head:first-child{margin-top:4px;}
  .section-head h2{font-size:19px;color:var(--ink);}
  .section-head .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(28,30,34,0.45);}

  /* ---------- STAT ROW ---------- */
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{
    background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:16px;
  }
  .stat-card .num{font-family:'Barlow Condensed';font-size:30px;font-weight:700;line-height:1;}
  .stat-card .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;opacity:.6;margin-top:6px;}
  .stat-card.yellow{background:var(--yellow);color:var(--ink);}

  /* ---------- WORK TICKET CARD (signature element) ---------- */
  .ticket{
    position:relative;background:#fff;border-radius:var(--radius);
    border:1.5px solid var(--line);margin-bottom:12px;overflow:hidden;
    display:flex;
  }
  .ticket .stripe{width:8px;flex-shrink:0;background:var(--blue);}
  .ticket.status-scheduled .stripe{background:var(--blue);}
  .ticket.status-in_progress .stripe{background:var(--yellow-deep);}
  .ticket.status-completed .stripe{background:var(--green);}
  .ticket.status-invoiced .stripe{background:#8a8f98;}
  .ticket .punch-hole{
    position:absolute;left:-6px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);
  }
  .ticket-body{padding:14px 16px 14px 18px;flex:1;}
  .ticket-body .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ticket-body .job-title{font-size:16px;font-weight:600;color:var(--ink);font-family:'Inter';}
  .ticket-body .customer{font-size:13px;color:rgba(28,30,34,0.55);margin-top:2px;}
  .ticket-body .meta-row{display:flex;gap:14px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(28,30,34,0.55);flex-wrap:wrap;}
  .status-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
    padding:4px 9px;border-radius:20px;white-space:nowrap;
  }
  .status-tag.scheduled{background:rgba(44,95,124,0.12);color:var(--blue);}
  .status-tag.in_progress{background:rgba(217,168,0,0.15);color:var(--yellow-deep);}
  .status-tag.completed{background:rgba(62,137,20,0.12);color:var(--green);}
  .status-tag.invoiced{background:rgba(0,0,0,0.06);color:#5a5f68;}

  .empty-state{
    text-align:center;padding:40px 20px;color:rgba(28,30,34,0.4);
  }
  .empty-state .glyph{font-size:32px;margin-bottom:8px;}
  .empty-state p{font-size:14px;margin:0;}

  .fab{
    position:fixed;bottom:92px;right:calc(50% - 240px + 20px);
    width:56px;height:56px;border-radius:50%;background:var(--yellow);color:var(--ink);
    border:none;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,0.2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:20;
  }
  @media (max-width:480px){ .fab{right:20px;} }

  /* ---------- BOTTOM NAV ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:#fff;border-top:1.5px solid var(--line);display:flex;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:15;
  }
  .navbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;cursor:pointer;color:rgba(28,30,34,0.4);padding:6px 2px;
  }
  .navbtn .ic{font-size:19px;}
  .navbtn .lb{font-size:10px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;text-transform:uppercase;}
  .navbtn.active{color:var(--ink);}
  .navbtn.active .ic{color:var(--yellow-deep);}

  .helper-clock{
    background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:20px;
  }
  .helper-clock .status{font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:.05em;}
  .helper-clock .time{font-family:'Barlow Condensed';font-size:38px;margin:6px 0 16px;}
  .helper-clock .btn-primary{max-width:220px;margin:0 auto;}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== LOGIN ===================== -->
  <div id="loginScreen" class="login-screen">
    <div class="brand"><span class="punch"></span></div>
    <h1>TICKET</h1>
    <div class="tag">Jobs · Quotes · Invoices — one app</div>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="you@407renovations.com" value="javier@407renovations.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••"/>
    </div>
    <button class="btn btn-primary" onclick="enterApp('owner')">Sign in as Owner</button>
    <button class="btn btn-ghost" onclick="enterApp('helper')">Sign in as Helper (demo)</button>
    <div class="switch-role">Demo mode — no Supabase project connected yet.</div>
  </div>

  <!-- ===================== OWNER APP ===================== -->
  <div id="ownerApp" class="hidden">
    <div class="topbar">
      <div>
        <div class="co-name">407 RENOVATIONS</div>
        <span class="role-pill">Owner</span>
      </div>
      <button class="icon-btn" onclick="logout()">⎋</button>
    </div>

    <!-- DASHBOARD -->
    <div id="ownerTab-dashboard" class="content tabpane">
      <div class="stat-row">
        <div class="stat-card yellow"><div class="num" id="statOpenJobs">3</div><div class="label">Open Jobs</div></div>
        <div class="stat-card"><div class="num mono" id="statInvoiceTotal">$0</div><div class="label">Open Invoices</div></div>
      </div>
      <div class="section-head"><h2>Today</h2><span class="count" id="todayCount"></span></div>
      <div id="todayList"></div>
      <div class="section-head"><h2>Up Next</h2></div>
      <div id="upcomingList"></div>
    </div>

    <!-- JOBS -->
    <div id="ownerTab-jobs" class="content tabpane hidden">
      <div class="section-head"><h2>All Jobs</h2><span class="count" id="jobsCount"></span></div>
      <div id="jobsList"></div>
    </div>

    <!-- CUSTOMERS -->
    <div id="ownerTab-customers" class="content tabpane hidden">
      <div class="section-head"><h2>Customers</h2><span class="count" id="customersCount"></span></div>
      <div id="customersList"></div>
    </div>

    <!-- MONEY (estimates + invoices) -->
    <div id="ownerTab-money" class="content tabpane hidden">
      <div class="section-head"><h2>Estimates</h2><span class="count" id="estimatesCount"></span></div>
      <div id="estimatesList"></div>
      <div class="section-head"><h2>Invoices</h2><span class="count" id="invoicesCount"></span></div>
      <div id="invoicesList"></div>
    </div>

    <button class="fab" onclick="alert('Hook this up to a New Job / New Estimate sheet next.')">+</button>

    <div class="bottomnav">
      <button class="navbtn active" data-tab="dashboard" onclick="showOwnerTab('dashboard')"><span class="ic">⌂</span><span class="lb">Home</span></button>
      <button class="navbtn" data-tab="jobs" onclick="showOwnerTab('jobs')"><span class="ic">🛠</span><span class="lb">Jobs</span></button>
      <button class="navbtn" data-tab="customers" onclick="showOwnerTab('customers')"><span class="ic">☺</span><span class="lb">Customers</span></button>
      <button class="navbtn" data-tab="money" onclick="showOwnerTab('money')"><span class="ic">$</span><span class="lb">Money</span></button>
    </div>
  </div>

  <!-- ===================== HELPER APP ===================== -->
  <div id="helperApp" class="hidden">
    <div class="topbar">
      <div>
        <div class="co-name">MY JOBS</div>
        <span class="role-pill">Helper</span>
      </div>
      <button class="icon-btn" onclick="logout()">⎋</button>
    </div>
    <div class="content">
      <div class="helper-clock">
        <div class="status" id="clockStatus">Clocked Out</div>
        <div class="time" id="clockTime">--:--</div>
        <button class="btn btn-primary" id="clockBtn" onclick="toggleClock()">Clock In</button>
      </div>
      <div class="section-head"><h2>Today's Jobs</h2></div>
      <div id="helperJobsList"></div>
    </div>
    <div class="bottomnav">
      <button class="navbtn active"><span class="ic">🛠</span><span class="lb">Today</span></button>
      <button class="navbtn"><span class="ic">📷</span><span class="lb">Photos</span></button>
      <button class="navbtn"><span class="ic">☺</span><span class="lb">Profile</span></button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   DEMO DATA — swap this whole block for real Supabase queries
   once you connect a project (see SUPABASE SETUP comment below).
   ============================================================ */
const demoCustomers = [
  {id:1, name:"Maria Gomez", phone:"(407) 555-0142", address:"1420 Lakeview Dr, Orlando FL"},
  {id:2, name:"Tom Reyes", phone:"(407) 555-0198", address:"88 Palmetto St, Winter Park FL"},
  {id:3, name:"Lisa Chen", phone:"(321) 555-0110", address:"305 Bay Hill Rd, Orlando FL"},
];
const demoJobs = [
  {id:1, title:"Kitchen remodel", customer:"Maria Gomez", status:"in_progress", when:"Today · 9:00 AM", address:"1420 Lakeview Dr"},
  {id:2, title:"Bathroom tile repair", customer:"Tom Reyes", status:"scheduled", when:"Today · 1:30 PM", address:"88 Palmetto St"},
  {id:3, title:"Deck framing estimate walk", customer:"Lisa Chen", status:"scheduled", when:"Tomorrow · 10:00 AM", address:"305 Bay Hill Rd"},
  {id:4, title:"Fence repair", customer:"Tom Reyes", status:"completed", when:"Yesterday", address:"88 Palmetto St"},
  {id:5, title:"Cabinet install", customer:"Maria Gomez", status:"invoiced", when:"Last week", address:"1420 Lakeview Dr"},
];
const demoEstimates = [
  {id:1, customer:"Lisa Chen", total:4200, status:"sent"},
  {id:2, customer:"Maria Gomez", total:1150, status:"draft"},
];
const demoInvoices = [
  {id:1, customer:"Maria Gomez", total:2800, status:"sent", due:"Sep 2"},
];

function statusLabel(s){ return s.replace('_',' '); }

function ticketHTML(job){
  return `
  <div class="ticket status-${job.status}">
    <div class="stripe"></div>
    <div class="punch-hole"></div>
    <div class="ticket-body">
      <div class="top-row">
        <div>
          <div class="job-title">${job.title}</div>
          <div class="customer">${job.customer}</div>
        </div>
        <span class="status-tag ${job.status}">${statusLabel(job.status)}</span>
      </div>
      <div class="meta-row">
        <span>🕐 ${job.when}</span>
        <span>📍 ${job.address}</span>
      </div>
    </div>
  </div>`;
}

function customerHTML(c){
  return `
  <div class="ticket status-scheduled" style="display:flex;">
    <div class="stripe" style="background:var(--ink);"></div>
    <div class="punch-hole"></div>
    <div class="ticket-body">
      <div class="job-title">${c.name}</div>
      <div class="meta-row"><span>☎ ${c.phone}</span></div>
      <div class="meta-row"><span>📍 ${c.address}</span></div>
    </div>
  </div>`;
}

function moneyHTML(item, kind){
  const tag = kind==='invoice' ? item.status : item.status;
  return `
  <div class="ticket status-${item.status==='paid'?'completed':(item.status==='sent'?'scheduled':'invoiced')}">
    <div class="stripe"></div>
    <div class="punch-hole"></div>
    <div class="ticket-body">
      <div class="top-row">
        <div>
          <div class="job-title">${item.customer}</div>
          <div class="customer mono">$${item.total.toLocaleString()}${item.due ? ' · due '+item.due : ''}</div>
        </div>
        <span class="status-tag ${item.status==='paid'||item.status==='approved'?'completed':(item.status==='sent'?'scheduled':'invoiced')}">${item.status}</span>
      </div>
    </div>
  </div>`;
}

function renderOwner(){
  document.getElementById('todayList').innerHTML = demoJobs.filter(j=>j.when.startsWith('Today')).map(ticketHTML).join('') || `<div class="empty-state"><div class="glyph">🛠</div><p>No jobs today. Tap + to create one.</p></div>`;
  document.getElementById('upcomingList').innerHTML = demoJobs.filter(j=>j.when.startsWith('Tomorrow')).map(ticketHTML).join('') || `<div class="empty-state"><p>Nothing scheduled yet.</p></div>`;
  document.getElementById('jobsList').innerHTML = demoJobs.map(ticketHTML).join('');
  document.getElementById('jobsCount').textContent = demoJobs.length;
  document.getElementById('customersList').innerHTML = demoCustomers.map(customerHTML).join('');
  document.getElementById('customersCount').textContent = demoCustomers.length;
  document.getElementById('estimatesList').innerHTML = demoEstimates.map(e=>moneyHTML(e,'estimate')).join('');
  document.getElementById('estimatesCount').textContent = demoEstimates.length;
  document.getElementById('invoicesList').innerHTML = demoInvoices.map(i=>moneyHTML(i,'invoice')).join('');
  document.getElementById('invoicesCount').textContent = demoInvoices.length;
  document.getElementById('statOpenJobs').textContent = demoJobs.filter(j=>j.status!=='completed'&&j.status!=='invoiced').length;
  const openTotal = demoInvoices.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.total,0);
  document.getElementById('statInvoiceTotal').textContent = '$'+openTotal.toLocaleString();
}

function renderHelper(){
  document.getElementById('helperJobsList').innerHTML = demoJobs.filter(j=>j.when.startsWith('Today')).map(ticketHTML).join('');
}

function showOwnerTab(tab){
  document.querySelectorAll('.tabpane').forEach(el=>el.classList.add('hidden'));
  document.getElementById('ownerTab-'+tab).classList.remove('hidden');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.navbtn[data-tab="${tab}"]`).classList.add('active');
}

function enterApp(role){
  document.getElementById('loginScreen').classList.add('hidden');
  if(role==='owner'){
    document.getElementById('ownerApp').classList.remove('hidden');
    renderOwner();
  } else {
    document.getElementById('helperApp').classList.remove('hidden');
    renderHelper();
  }
}
function logout(){
  document.getElementById('ownerApp').classList.add('hidden');
  document.getElementById('helperApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

let clockedIn=false, clockStart=null, clockTimer=null;
function toggleClock(){
  clockedIn=!clockedIn;
  const btn=document.getElementById('clockBtn');
  const status=document.getElementById('clockStatus');
  if(clockedIn){
    clockStart=Date.now();
    btn.textContent='Clock Out';
    status.textContent='Clocked In';
    clockTimer=setInterval(()=>{
      const secs=Math.floor((Date.now()-clockStart)/1000);
      const h=String(Math.floor(secs/3600)).padStart(2,'0');
      const m=String(Math.floor((secs%3600)/60)).padStart(2,'0');
      document.getElementById('clockTime').textContent=`${h}:${m}`;
    },1000);
  } else {
    clearInterval(clockTimer);
    btn.textContent='Clock In';
    status.textContent='Clocked Out';
    document.getElementById('clockTime').textContent='--:--';
  }
}

/* ============================================================
   SUPABASE SETUP (next step, once you create the project):

   const supabase = window.supabase.createClient(
     'https://YOUR-PROJECT.supabase.co',
     'YOUR-ANON-KEY'
   );

   Then replace demoJobs/demoCustomers/etc. with real queries, e.g.:
   const { data: jobs } = await supabase.from('jobs').select('*, customers(name), job_assignments(profile_id)');

   Auth: supabase.auth.signInWithPassword({email, password})
   Role comes from profiles.role — route to ownerApp or helperApp based on it.
   ============================================================ */
</script>
</body>
</html>
